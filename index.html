<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>А ты? ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --milk:#FBF6EC;
  --milk-2:#F3ECDD;
  --graphite:#2A2723;
  --graphite-soft:#5A554D;
  --burgundy:#7A1E2B;
  --burgundy-deep:#57121C;
  --burgundy-tint:#F1DADD;
  --yellow:#F0C33F;
  --line:#E7DFCC;
  --white:#FFFFFF;
  --radius:20px;
  --radius-sm:12px;
  --shadow:0 8px 24px rgba(42,39,35,0.08);
  --shadow-lift:0 14px 34px rgba(122,30,43,0.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--milk);
  background-image:radial-gradient(circle at 12% 8%, rgba(122,30,43,0.05), transparent 40%),
                    radial-gradient(circle at 90% 90%, rgba(240,195,63,0.10), transparent 45%);
  color:var(--graphite);
  font-family:'Manrope',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Unbounded',sans-serif;}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:92px;}
.screen{padding:20px 18px 8px;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,textarea,select{font-family:inherit;font-size:15px;}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 4px;}
.brand{display:flex;align-items:center;gap:8px;}
.brand-mark{font-family:'Unbounded',sans-serif;font-weight:800;font-size:19px;color:var(--burgundy);}
.brand-sub{font-size:11px;color:var(--graphite-soft);letter-spacing:.02em;}
.back-btn{width:36px;height:36px;border-radius:50%;background:var(--white);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--graphite);}

/* ---------- Sticker (meme reaction) ---------- */
.sticker{
  display:inline-block;
  background:var(--yellow);
  color:var(--graphite);
  font-weight:700;
  font-size:13.5px;
  padding:9px 14px;
  border-radius:11px;
  border:2px solid var(--graphite);
  transform:rotate(-2deg);
  box-shadow:3px 3px 0 var(--graphite);
  margin:10px 0;
  max-width:100%;
}
.sticker.pink{background:var(--burgundy-tint);transform:rotate(1.5deg);}
.sticker.wrap{display:block;width:fit-content;}

/* ---------- Home ---------- */
.hero{
  background:linear-gradient(160deg,var(--burgundy) 0%, var(--burgundy-deep) 100%);
  border-radius:26px;padding:26px 20px 22px;color:var(--milk);position:relative;overflow:hidden;box-shadow:var(--shadow-lift);
}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;background:rgba(240,195,63,0.18);border-radius:50%;pointer-events:none;}
.hero-title{font-size:26px;margin:0;font-weight:700;}
.hero-sub{opacity:.85;font-size:13px;margin-top:4px;}
.avatars{display:flex;gap:-8px;margin-top:16px;align-items:center;}
.avatar{
  width:50px;height:50px;border-radius:50%;background:var(--yellow);
  display:flex;align-items:center;justify-content:center;font-size:24px;
  border:3px solid var(--milk);box-shadow:var(--shadow);
}
.avatar.small{width:30px;height:30px;font-size:15px;border-width:2px;}
.avatar-stack{display:flex;}
.avatar-stack .avatar:nth-child(2){margin-left:-14px;}
.plus-sign{color:var(--milk);opacity:.6;margin:0 6px;font-size:20px;}

.stat-strip{display:flex;gap:10px;margin-top:18px;}
.stat-chip{flex:1;background:rgba(255,255,255,0.12);border-radius:14px;padding:10px 8px;text-align:center;}
.stat-chip b{display:block;font-size:18px;font-family:'Unbounded',sans-serif;}
.stat-chip span{font-size:10.5px;opacity:.85;}

.qotd-card{
  margin-top:18px;background:var(--white);border-radius:22px;padding:18px;box-shadow:var(--shadow);border:1.5px solid var(--line);
}
.qotd-eyebrow{font-size:11px;font-weight:800;color:var(--burgundy);letter-spacing:.06em;text-transform:uppercase;}
.qotd-text{font-size:17px;font-weight:700;margin:8px 0 14px;line-height:1.35;}
.qotd-status{font-size:12.5px;color:var(--graphite-soft);}

.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;}
.quick-tile{
  background:var(--white);border-radius:18px;padding:16px 14px;box-shadow:var(--shadow);border:1.5px solid var(--line);
  display:flex;flex-direction:column;gap:8px;
}
.quick-tile .ic{font-size:22px;}
.quick-tile .lb{font-weight:700;font-size:14px;}
.quick-tile .ct{font-size:11.5px;color:var(--graphite-soft);}

.section-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--graphite-soft);margin:26px 0 12px;}

/* ---------- Category / question list ---------- */
.cat-card{background:var(--white);border-radius:18px;margin-bottom:12px;box-shadow:var(--shadow);border:1.5px solid var(--line);overflow:hidden;}
.cat-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px;}
.cat-name{font-weight:700;font-size:15px;}
.cat-progress-wrap{height:5px;background:var(--milk-2);border-radius:6px;margin-top:8px;overflow:hidden;}
.cat-progress{height:100%;background:var(--burgundy);border-radius:6px;}
.cat-count{font-size:11.5px;color:var(--graphite-soft);margin-top:6px;}
.chev{font-size:13px;color:var(--graphite-soft);transition:transform .2s;}
.cat-body{border-top:1px solid var(--line);}
.q-row{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--milk-2);}
.q-row:last-child{border-bottom:none;}
.q-row-text{flex:1;font-size:13.8px;line-height:1.35;}
.status-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.status-dot.none{background:#DCD5C4;}
.status-dot.one{background:var(--yellow);}
.status-dot.both{background:var(--burgundy);}

/* ---------- Question detail (full screen) ---------- */
.q-detail-card{background:var(--white);border-radius:22px;padding:20px;box-shadow:var(--shadow);border:1.5px solid var(--line);margin-top:6px;}
.q-cat-tag{font-size:11px;font-weight:800;color:var(--burgundy);text-transform:uppercase;letter-spacing:.05em;}
.q-detail-text{font-size:19px;font-weight:700;margin:10px 0 16px;line-height:1.35;}
textarea.answer-input{
  width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;
  resize:vertical;font-size:14.5px;background:var(--milk);
}
textarea.answer-input:focus{outline:2px solid var(--burgundy);outline-offset:1px;}
.primary-btn{
  background:var(--burgundy);color:var(--milk);padding:13px 20px;border-radius:14px;font-weight:700;font-size:14.5px;
  width:100%;margin-top:12px;box-shadow:0 6px 16px rgba(122,30,43,0.25);
}
.primary-btn:disabled{opacity:.45;}
.secondary-btn{
  background:var(--white);color:var(--burgundy);border:1.5px solid var(--burgundy);padding:11px 18px;border-radius:14px;
  font-weight:700;font-size:13.5px;width:100%;margin-top:10px;
}
.waiting-box{background:var(--milk-2);border-radius:14px;padding:16px;text-align:center;margin-top:8px;}
.waiting-box .big{font-size:26px;}
.answers-compare{display:flex;flex-direction:column;gap:12px;margin-top:8px;}
.answer-card{border-radius:16px;padding:14px 16px;border:1.5px solid var(--line);}
.answer-card .who{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin-bottom:6px;}
.answer-card .txt{font-size:14.5px;line-height:1.4;}
.answer-card.match{background:var(--burgundy-tint);border-color:var(--burgundy);}

/* ---------- Memories ---------- */
.mem-card{background:var(--white);border-radius:18px;padding:14px;box-shadow:var(--shadow);border:1.5px solid var(--line);margin-bottom:12px;}
.mem-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.mem-who{font-weight:700;font-size:13px;}
.mem-date{font-size:11.5px;color:var(--graphite-soft);margin-left:auto;}
.mem-text{font-size:14px;line-height:1.4;}
.mem-photo{width:100%;border-radius:12px;margin-top:10px;display:block;max-height:320px;object-fit:cover;}
.fab{
  position:fixed;bottom:104px;left:50%;transform:translateX(180px);
  width:54px;height:54px;border-radius:50%;background:var(--burgundy);color:var(--milk);font-size:26px;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lift);z-index:20;
}

/* ---------- Forms ---------- */
.field-label{font-size:12.5px;font-weight:700;color:var(--graphite-soft);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.03em;}
input.text-input, select.text-input{
  width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--white);font-size:14.5px;
}
.tabs{display:flex;gap:8px;margin-top:10px;background:var(--milk-2);padding:4px;border-radius:14px;}
.tab-btn{flex:1;padding:10px;border-radius:11px;font-weight:700;font-size:13px;color:var(--graphite-soft);}
.tab-btn.active{background:var(--white);color:var(--burgundy);box-shadow:var(--shadow);}
.chip-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
.chip{
  background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;
}
.chip button{background:var(--burgundy);color:var(--milk);width:26px;height:26px;border-radius:50%;font-weight:800;flex-shrink:0;}

/* ---------- Stats / Profile ---------- */
.profile-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 6px;}
.avatar.big{width:74px;height:74px;font-size:36px;border-width:3px;}
.avatar-row{display:flex;gap:18px;margin-top:6px;}
.avatar-col{display:flex;flex-direction:column;align-items:center;gap:6px;}
.avatar-col .nm{font-weight:700;font-size:13px;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;}
.stat-box{background:var(--white);border-radius:18px;padding:16px;box-shadow:var(--shadow);border:1.5px solid var(--line);text-align:center;}
.stat-box b{display:block;font-family:'Unbounded',sans-serif;font-size:24px;color:var(--burgundy);}
.stat-box span{font-size:11.5px;color:var(--graphite-soft);}
.emoji-pop{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;background:var(--white);padding:14px;border-radius:16px;box-shadow:var(--shadow);}
.emoji-opt{font-size:22px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;}
.emoji-opt:active{background:var(--milk-2);}

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1.5px solid var(--line);
  display:flex;max-width:480px;margin:0 auto;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:30;
  box-shadow:0 -6px 20px rgba(42,39,35,0.06);
}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--graphite-soft);}
.nav-item.active{color:var(--burgundy);}
.nav-item .ic{font-size:20px;}
.nav-item .lb{font-size:10.5px;font-weight:700;}

/* ---------- Onboarding ---------- */
.onb-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:30px 26px;max-width:480px;margin:0 auto;}
.onb-logo{font-family:'Unbounded',sans-serif;font-weight:800;font-size:34px;color:var(--burgundy);text-align:center;}
.onb-sub{text-align:center;color:var(--graphite-soft);font-size:14px;margin-top:8px;}
.who-grid{display:flex;gap:14px;margin-top:34px;}
.who-card{
  flex:1;background:var(--white);border-radius:22px;padding:24px 10px;text-align:center;box-shadow:var(--shadow);
  border:2px solid var(--line);
}
.who-card .em{font-size:38px;}
.who-card .nm{font-weight:800;font-family:'Unbounded',sans-serif;margin-top:10px;font-size:15px;}

/* misc */
.empty-state{text-align:center;padding:40px 20px;color:var(--graphite-soft);}
.empty-state .em{font-size:36px;margin-bottom:8px;}
.muted{color:var(--graphite-soft);font-size:12.5px;}
.row-between{display:flex;align-items:center;justify-content:space-between;}
.toast{
  position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--graphite);color:var(--milk);
  padding:11px 18px;border-radius:14px;font-size:13px;font-weight:600;z-index:50;box-shadow:var(--shadow-lift);
  max-width:90%;text-align:center;
}
.card-plain{background:var(--white);border-radius:18px;padding:16px;box-shadow:var(--shadow);border:1.5px solid var(--line);margin-bottom:12px;}
.overlay-close{position:fixed;top:16px;right:16px;}

/* ---------- Bell / Feed ---------- */
.bell-btn{
  position:absolute;top:20px;right:18px;width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,0.16);display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--milk);z-index:5;
}
.bell-badge{
  position:absolute;top:-3px;right:-3px;background:var(--yellow);color:var(--graphite);
  font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--burgundy-deep);padding:0 3px;
}
.feed-item{display:flex;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);}
.feed-item:last-child{border-bottom:none;}
.feed-ic{width:38px;height:38px;border-radius:50%;background:var(--milk-2);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.feed-txt{font-size:13.8px;line-height:1.4;}
.feed-txt b{font-weight:800;}
.feed-time{font-size:11px;color:var(--graphite-soft);margin-top:3px;}
.feed-item.unread .feed-txt{font-weight:600;}
.feed-item.unread{background:var(--milk-2);border-radius:14px;}
</style>
</head>

<script>

/* ============ STORAGE HELPERS ============ */
async function sGet(key, shared){
  try{ const r = await window.storage.get(key, !!shared); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function sSet(key, value, shared){
  try{ await window.storage.set(key, JSON.stringify(value), !!shared); return true; }
  catch(e){ return false; }
}

/* ============ STATE ============ */
let state = {
  identity: null,        // 'Ира' | 'Полина'
  tab: 'home',           // home | questions | memories(inside 'us') | us | more
  view: null,            // sub-view stack info
  customQuestions: [],
  answers: {},           // key `${qid}:${name}` -> {text, createdAt}
  memories: [],
  profiles: {},          // name -> {avatar}
  pairMeta: {createdAt: null},
  metaMemeCount: 0,
  activityLog: [],
  lastSeenActivity: 0,
  loaded: false,
  toast: null,
  openCategory: null,
  activeQuestionId: null,
  addTab: 'manual',
  genTheme: '',
  genLoading: false,
  genResults: [],
  genError: null,
  showAvatarPicker: null,
  showAddMemory: false,
  memDraft: {date: '', text: '', photo: null},
};

function allQuestions(){ return BASE_QUESTIONS.concat(state.customQuestions); }
function qById(id){ return allQuestions().find(q => q.id === id); }
function answerKey(qid, name){ return 'answer:'+qid+':'+name; }
function myAnswer(qid){ return state.answers[answerKey(qid, state.identity)] || null; }
function partnerName(){ return state.identity === 'Ира' ? 'Полина' : 'Ира'; }
function partnerAnswer(qid){ return state.answers[answerKey(qid, partnerName())] || null; }
function bothAnswered(qid){ return !!myAnswer(qid) && !!partnerAnswer(qid); }
function statusOf(qid){
  const a = !!myAnswer(qid), b = !!partnerAnswer(qid);
  if(a && b) return 'both';
  if(a || b) return 'one';
  return 'none';
}
function questionOfDay(){
  const d = new Date();
  const dayKey = d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
  const idx = dayKey % BASE_QUESTIONS.length;
  return BASE_QUESTIONS[idx];
}
function showToast(msg){
  state.toast = msg;
  render();
  setTimeout(()=>{ state.toast = null; render(); }, 2600);
}

/* ============ LOAD / SYNC ============ */
async function loadAll(){
  const [custom, memories, pIra, pPolina, pairMeta, memeCount, activity, answersAll] = await Promise.all([
    sGet('custom_questions', true),
    sGet('memories', true),
    sGet('profile:Ира', true),
    sGet('profile:Полина', true),
    sGet('pair:meta', true),
    sGet('stats_meme_count', true),
    sGet('activity_log', true),
    sGet('answers_all', true),
  ]);
  state.customQuestions = custom || [];
  state.memories = memories || [];
  state.profiles = {'Ира': pIra || {avatar:'🍒'}, 'Полина': pPolina || {avatar:'🌸'}};
  state.metaMemeCount = memeCount || 0;
  state.activityLog = activity || [];
  if(!pairMeta){
    state.pairMeta = {createdAt: Date.now()};
    await sSet('pair:meta', state.pairMeta, true);
  } else {
    state.pairMeta = pairMeta;
  }
  state.answers = answersAll || {};
  state.loaded = true;
}

let pollTimer = null;
function startPolling(){
  if(pollTimer) return;
  pollTimer = setInterval(async ()=>{
    const before = JSON.stringify({a:state.answers,c:state.customQuestions,m:state.memories,p:state.profiles,f:state.activityLog});
    await loadAll();
    const after = JSON.stringify({a:state.answers,c:state.customQuestions,m:state.memories,p:state.profiles,f:state.activityLog});
    if(before !== after) render();
  }, 4000);
}

async function pushActivity(evt){
  const item = Object.assign({id:'e'+Date.now()+Math.floor(Math.random()*999), createdAt: Date.now()}, evt);
  const list = [item].concat(state.activityLog).slice(0, 60);
  state.activityLog = list;
  await sSet('activity_log', list, true);
}
function unreadCount(){
  return state.activityLog.filter(e => e.actor !== state.identity && e.createdAt > (state.lastSeenActivity||0)).length;
}
async function markFeedSeen(){
  state.lastSeenActivity = Date.now();
  await sSet('last_seen:'+state.identity, state.lastSeenActivity, false);
}

/* ============ ACTIONS ============ */
async function submitAnswer(qid, text){
  if(!text || !text.trim()) return;
  const key = answerKey(qid, state.identity);
  const val = {text: text.trim(), createdAt: Date.now()};
  const latest = await sGet('answers_all', true);
  const merged = Object.assign({}, latest || {}, state.answers, {[key]: val});
  state.answers = merged;
  await sSet('answers_all', merged, true);
  const q = qById(qid);
  await pushActivity({type:'answer', actor: state.identity, qid, qtext: q ? q.text : ''});
  render();
  if(bothAnswered(qid)){
    const cnt = (state.metaMemeCount||0)+1;
    state.metaMemeCount = cnt;
    sSet('stats_meme_count', cnt, true);
  }
}

async function addCustomQuestion(text, cat){
  if(!text || !text.trim()) return;
  const id = 'c'+Date.now()+Math.floor(Math.random()*999);
  const q = {id, cat: cat || 'Своё', text: text.trim(), addedBy: state.identity, addedAt: Date.now()};
  const list = state.customQuestions.concat([q]);
  state.customQuestions = list;
  await sSet('custom_questions', list, true);
  await pushActivity({type:'question', actor: state.identity, qid: id, qtext: q.text, cat: q.cat});
  render();
  showToast('Вопрос добавлен в ваш банк ✨');
}

async function addMemory(entry){
  const item = Object.assign({id:'m'+Date.now(), author: state.identity, createdAt: Date.now()}, entry);
  const list = [item].concat(state.memories);
  state.memories = list;
  await sSet('memories', list, true);
  await pushActivity({type:'memory', actor: state.identity, memText: entry.text});
  render();
  showToast(pick(REACTIONS.memory));
}

async function setAvatar(name, emoji){
  state.profiles[name] = {avatar: emoji};
  await sSet('profile:'+name, {avatar: emoji}, true);
  state.showAvatarPicker = null;
  render();
}

/* ============ GENERATOR (Claude API) ============ */
async function runGenerator(){
  if(!state.genTheme.trim()) return;
  state.genLoading = true; state.genError = null; state.genResults = [];
  render();
  try{
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:700,
        messages:[{role:"user", content:
          "Придумай 5 глубоких, живых вопросов для пары друг другу на тему: \""+state.genTheme.trim()+"\". "+
          "Вопросы на русском языке, без нумерации, не банальные, разного тона (можно один-два с лёгким юмором). "+
          "Ответь СТРОГО в формате JSON-массива строк, без markdown, без пояснений, например: [\"Вопрос один?\",\"Вопрос два?\"]"
        }]
      })
    });
    const data = await resp.json();
    let text = (data.content||[]).map(b=>b.text||"").join("");
    text = text.trim().replace(/^```json/,'').replace(/^```/,'').replace(/```$/,'').trim();
    const arr = JSON.parse(text);
    state.genResults = Array.isArray(arr) ? arr.filter(x=>typeof x==='string') : [];
    if(state.genResults.length === 0) state.genError = "Не получилось придумать вопросы. Попробуй другую формулировку темы.";
  }catch(e){
    state.genError = "Генератор сейчас недоступен (нет сети или сбой). Можно добавить вопрос вручную.";
  }
  state.genLoading = false;
  render();
}

/* ============ PHOTO COMPRESSION ============ */
function readAndCompress(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 900;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale;
        canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function screenQuestions(){
  const cats = CATEGORIES.concat(state.customQuestions.some(q=>q.cat==='Своё')?['Своё']:[]).concat(
    Array.from(new Set(state.customQuestions.map(q=>q.cat))).filter(c=>c!=='Своё' && !CATEGORIES.includes(c))
  );
  const uniqCats = Array.from(new Set(cats));
  return '<div class="screen">'+
    '<h2 style="margin:6px 0 14px;">Вопросы</h2>'+
    uniqCats.map(cat => {
      const p = categoryProgress(cat);
      const open = state.openCategory === cat;
      const qs = allQuestions().filter(q=>q.cat===cat);
      return '<div class="cat-card">'+
        '<button class="cat-head" style="width:100%;" onclick="toggleCategory('+"'"+cat.replace(/'/g,"\\'")+"'"+')">'+
          '<div style="flex:1;text-align:left;">'+
            '<div class="cat-name">'+esc(cat)+'</div>'+
            '<div class="cat-progress-wrap"><div class="cat-progress" style="width:'+(p.total?Math.round(p.done/p.total*100):0)+'%"></div></div>'+
            '<div class="cat-count">'+p.done+' / '+p.total+' раскрыто</div>'+
          '</div>'+
          '<div class="chev">'+(open?'▲':'▼')+'</div>'+
        '</button>'+
        (open ? '<div class="cat-body">'+qs.map(q=>{
          const st = statusOf(q.id);
          return '<button class="q-row" style="width:100%;text-align:left;" onclick="openQuestion('+q.id+')">'+
            '<div class="status-dot '+st+'"></div>'+
            '<div class="q-row-text">'+esc(q.text)+'</div>'+
          '</button>';
        }).join('') + '</div>' : '')+
      '</div>';
    }).join('')+
  '</div>';
}

function screenQuestionDetail(){
  const q = qById(state.activeQuestionId);
  if(!q) return '<div class="screen"><div class="empty-state">Вопрос не найден</div></div>';
  const st = statusOf(q.id);
  let body = '';
  if(st === 'both'){
    const mine = myAnswer(q.id), theirs = partnerAnswer(q.id);
    const isMatch = norm(mine.text) === norm(theirs.text);
    body = '<div class="sticker '+(isMatch?'':'pink')+'">'+ (isMatch? pick(REACTIONS.match) : pick(REACTIONS.contrast)) +'</div>'+
      '<div class="answers-compare">'+
        [ [state.identity, mine], [partnerName(), theirs] ].map(([name,a])=>
          '<div class="answer-card '+(isMatch?'match':'')+'">'+
            '<div class="who">'+avatarHtml(name,'small')+' '+esc(name)+'</div>'+
            '<div class="txt">'+esc(a.text)+'</div>'+
          '</div>'
        ).join('')+
      '</div>';
  } else if(myAnswer(q.id) && !partnerAnswer(q.id)){
    body = '<div class="waiting-box"><div class="big">🕰️</div><div style="margin-top:6px;font-weight:700;">'+pick(REACTIONS.waiting)+'</div>'+
      '<div class="muted" style="margin-top:6px;">Твой ответ сохранён. Как только ответит '+partnerName()+' — увидите оба.</div></div>';
  } else if(!myAnswer(q.id) && partnerAnswer(q.id)){
    body = '<div class="waiting-box"><div class="big">👀</div><div style="margin-top:6px;font-weight:700;">'+partnerName()+' уже ответил(а)</div>'+
      '<div class="muted" style="margin-top:6px;">Ответ скрыт, пока не ответишь ты.</div></div>'+
      '<textarea class="answer-input" id="answerBox" placeholder="Твой ответ..."></textarea>'+
      '<button class="primary-btn" onclick="submitAnswerFromBox('+q.id+')">Ответить</button>';
  } else {
    body = '<div class="sticker">'+pick(REACTIONS.before)+'</div>'+
      '<textarea class="answer-input" id="answerBox" placeholder="Твой ответ..."></textarea>'+
      '<button class="primary-btn" onclick="submitAnswerFromBox('+q.id+')">Ответить</button>';
  }
  return '<div class="screen">'+
    '<button class="back-btn" onclick="goBack()">←</button>'+
    '<div class="q-detail-card" style="margin-top:14px;">'+
      '<div class="q-cat-tag">'+esc(q.cat)+'</div>'+
      '<div class="q-detail-text">'+esc(q.text)+'</div>'+
      body+
    '</div>'+
  '</div>';
}

function timeAgo(ts){
  const diff = Math.max(0, Date.now()-ts);
  const m = Math.floor(diff/60000);
  if(m < 1) return 'только что';
  if(m < 60) return m+' мин назад';
  const h = Math.floor(m/60);
  if(h < 24) return h+' ч назад';
  const d = Math.floor(h/24);
  if(d < 7) return d+' дн назад';
  return new Date(ts).toLocaleDateString('ru-RU');
}
function feedEventLine(e){
  if(e.type === 'answer') return {ic:'✍️', txt:'<b>'+esc(e.actor)+'</b> ответил(а) на вопрос «'+esc(e.qtext||'')+'»'};
  if(e.type === 'question') return {ic:'➕', txt:'<b>'+esc(e.actor)+'</b> добавил(а) новый вопрос «'+esc(e.qtext||'')+'»'+(e.cat?' в категорию '+esc(e.cat):'')};
  if(e.type === 'memory') return {ic:'📸', txt:'<b>'+esc(e.actor)+'</b> добавил(а) воспоминание'};
  return {ic:'✨', txt:'<b>'+esc(e.actor)+'</b> что-то сделал(а)'};
}
function screenFeed(){
  const events = state.activityLog;
  return '<div class="screen">'+
    '<button class="back-btn" onclick="goBack()">←</button>'+
    '<h2 style="margin:14px 0 6px;">Лента</h2>'+
    '<div class="muted" style="margin-bottom:10px;">Что происходило у вас двоих</div>'+
    '<div class="card-plain">'+
    (events.length===0 ? '<div class="empty-state"><div class="em">🔔</div>Пока тихо. Как только кто-то ответит на вопрос, добавит вопрос или воспоминание — здесь появится запись.</div>' :
      events.map(e=>{
        const {ic,txt} = feedEventLine(e);
        const isUnread = e.actor !== state.identity && e.createdAt > (state.lastSeenActivity||0);
        const clickable = e.type==='answer' || e.type==='question';
        const onclickAttr = clickable ? ' onclick="openQuestion('+e.qid+')" style="cursor:pointer;"' : '';
        return '<div class="feed-item '+(isUnread?'unread':'')+'"'+onclickAttr+'>'+
          '<div class="feed-ic">'+ic+'</div>'+
          '<div><div class="feed-txt">'+txt+'</div><div class="feed-time">'+timeAgo(e.createdAt)+'</div></div>'+
        '</div>';
      }).join('')
    )+
    '</div>'+
  '</div>';
}

function screenAnswersHistory(){
  const items = allQuestions().filter(q=>bothAnswered(q.id)).sort((a,b)=>{
    const ta = Math.max(myAnswer(a.id).createdAt, partnerAnswer(a.id).createdAt);
    const tb = Math.max(myAnswer(b.id).createdAt, partnerAnswer(b.id).createdAt);
    return tb - ta;
  });
  return '<div class="screen">'+
    '<button class="back-btn" onclick="goBack()">←</button>'+
    '<h2 style="margin:14px 0 14px;">Наши ответы</h2>'+
    (items.length===0 ? '<div class="empty-state"><div class="em">🗂️</div>Пока пусто. Ответьте вместе хотя бы на один вопрос — он появится здесь навсегда.</div>' :
      items.map(q=>{
        const mine=myAnswer(q.id), theirs=partnerAnswer(q.id);
        const isMatch = norm(mine.text)===norm(theirs.text);
        return '<button class="card-plain" style="width:100%;text-align:left;" onclick="openQuestion('+q.id+')">'+
          '<div class="q-cat-tag">'+esc(q.cat)+'</div>'+
          '<div style="font-weight:700;font-size:14.5px;margin:6px 0;">'+esc(q.text)+'</div>'+
          '<div class="muted">'+(isMatch?'✨ Совпало':'Разные ответы')+'</div>'+
        '</button>';
      }).join('')
    )+
  '</div>';
}

function screenMemories(){
  return '<div class="screen">'+
    '<button class="back-btn" onclick="goBack()">←</button>'+
    '<h2 style="margin:14px 0 14px;">Воспоминания</h2>'+
    (state.memories.length===0 ? '<div class="empty-state"><div class="em">📸</div>Здесь будет ваш цифровой дневник. Добавьте первое воспоминание.</div>' :
      state.memories.map(m=>
        '<div class="mem-card">'+
          '<div class="mem-head">'+avatarHtml(m.author,'small')+'<span class="mem-who">'+esc(m.author)+'</span>'+
          '<span class="mem-date">'+esc(m.date||'')+'</span></div>'+
          '<div class="mem-text">'+esc(m.text)+'</div>'+
          (m.photo?'<img class="mem-photo" src="'+m.photo+'">':'')+
        '</div>'
      ).join('')
    )+
    '<button class="fab" onclick="openAddMemory()">+</button>'+
  '</div>';
}

function screenAddMemory(){
  return '<div class="screen">'+
    '<button class="back-btn" onclick="closeAddMemory()">←</button>'+
    '<h2 style="margin:14px 0 6px;">Новое воспоминание</h2>'+
    '<div class="field-label">Дата</div>'+
    '<input class="text-input" type="date" id="memDate" value="'+(state.memDraft.date||new Date().toISOString().slice(0,10))+'">'+
    '<div class="field-label">Заметка</div>'+
    '<textarea class="answer-input" id="memText" placeholder="Что произошло?">'+esc(state.memDraft.text)+'</textarea>'+
    '<div class="field-label">Фото (необязательно)</div>'+
    '<input class="text-input" type="file" accept="image/*" id="memPhoto">'+
    (state.memDraft.photo ? '<img class="mem-photo" src="'+state.memDraft.photo+'" style="margin-top:10px;">' : '')+
    '<button class="primary-btn" onclick="saveMemoryDraft()">Сохранить</button>'+
  '</div>';
}

function screenAdd(){
  return '<div class="screen">'+
    '<button class="back-btn" onclick="goBack()">←</button>'+
    '<h2 style="margin:14px 0 6px;">Добавить вопрос</h2>'+
    '<div class="tabs">'+
      '<button class="tab-btn '+(state.addTab==='manual'?'active':'')+'" onclick="setAddTab(\'manual\')">Своими руками</button>'+
      '<button class="tab-btn '+(state.addTab==='gen'?'active':'')+'" onclick="setAddTab(\'gen\')">Генератор</button>'+
    '</div>'+
    (state.addTab==='manual' ? (
      '<div class="field-label">Текст вопроса</div>'+
      '<textarea class="answer-input" id="manualQText" placeholder="Например: Что тебе нравится в наших вечерах вдвоём?"></textarea>'+
      '<div class="field-label">Категория</div>'+
      '<select class="text-input" id="manualQCat">'+ CATEGORIES.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('') + '<option value="Своё">Своё</option></select>'+
      '<button class="primary-btn" onclick="submitManualQuestion()">Добавить в банк</button>'
    ) : (
      '<div class="field-label">Тема</div>'+
      '<input class="text-input" id="genThemeInput" placeholder="Например: путешествия, будущее, детство" value="'+esc(state.genTheme)+'">'+
      '<button class="primary-btn" onclick="triggerGenerate()" '+(state.genLoading?'disabled':'')+'>'+(state.genLoading?'Придумываю...':'Придумать вопросы')+'</button>'+
      (state.genError ? '<div class="muted" style="margin-top:10px;color:var(--burgundy);">'+esc(state.genError)+'</div>' : '')+
      (state.genResults.length ? '<div class="chip-list">'+ state.genResults.map((t,i)=>
        '<div class="chip"><span>'+esc(t)+'</span><button onclick="addGenerated('+i+')">+</button></div>'
      ).join('') + '</div>' : '')
    ))+
  '</div>';
}

function screenUs(){
  const answeredBoth = allQuestions().filter(q=>bothAnswered(q.id)).length;
  const matches = allQuestions().filter(q=>bothAnswered(q.id) && norm(myAnswer(q.id).text)===norm(partnerAnswer(q.id).text)).length;
  const days = state.pairMeta.createdAt ? Math.max(0, Math.floor((Date.now()-state.pairMeta.createdAt)/86400000)) : 0;
  return '<div class="screen">'+
    '<div class="profile-head">'+
      '<div class="hero-title" style="color:var(--burgundy);">Ира + Полина</div>'+
      '<div class="hero-sub" style="color:var(--graphite-soft);">ваша маленькая вселенная · '+days+' дн. вместе в приложении</div>'+
      '<div class="avatar-row">'+
        NAMES.map(n => '<div class="avatar-col"><button onclick="toggleAvatarPicker(\''+n+'\')">'+avatarHtml(n,'big')+'</button><div class="nm">'+n+'</div></div>').join('')+
      '</div>'+
    '</div>'+
    (state.showAvatarPicker ? (
      '<div class="emoji-pop">'+ AVATAR_EMOJIS.map(e=>'<button class="emoji-opt" onclick="setAvatarPick(\''+e+'\')">'+e+'</button>').join('') + '</div>'
    ) : '')+
    '<div class="stats-grid">'+
      '<div class="stat-box"><b>'+answeredBoth+'</b><span>вопросов раскрыто</span></div>'+
      '<div class="stat-box"><b>'+matches+'</b><span>совпадений</span></div>'+
      '<div class="stat-box"><b>'+state.memories.length+'</b><span>воспоминаний</span></div>'+
      '<div class="stat-box"><b>'+state.metaMemeCount+'</b><span>собрано реакций</span></div>'+
      '<div class="stat-box"><b>'+state.customQuestions.length+'</b><span>своих вопросов</span></div>'+
      '<div class="stat-box"><b>'+allQuestions().length+'</b><span>вопросов в банке</span></div>'+
    '</div>'+
    '<div class="muted" style="text-align:center;margin-top:16px;">Статистика общая для пары — здесь никто не соревнуется 💛</div>'+
  '</div>';
}

function screenMore(){
  return '<div class="screen">'+
    '<h2 style="margin:6px 0 16px;">Ещё</h2>'+
    '<div class="card-plain">'+
      '<div class="row-between"><div><b>Ты сейчас:</b> '+esc(state.identity)+'</div><button class="secondary-btn" style="width:auto;margin:0;padding:8px 14px;" onclick="switchIdentity()">Сменить</button></div>'+
    '</div>'+
    '<div class="card-plain">'+
      '<b>О приложении</b>'+
      '<div class="muted" style="margin-top:6px;">«А ты? ♡» — личный банк вопросов и воспоминаний для Иры и Полины. Ответы скрыты, пока не ответят обе. Данные синхронизируются между устройствами (обновление раз в несколько секунд).</div>'+
    '</div>'+
    '<div class="card-plain">'+
      '<b>Банк вопросов</b>'+
      '<div class="muted" style="margin-top:6px;">'+BASE_QUESTIONS.length+' вопросов из исходного списка + '+state.customQuestions.length+' добавленных вами.</div>'+
    '</div>'+
  '</div>';
}

/* ============ MASTER RENDER ============ */
function render(){
  const app = document.getElementById('app');
  if(!state.loaded){
    app.innerHTML = '<div class="onb-wrap"><div class="onb-logo">А ты? ♡</div><div class="onb-sub" style="margin-top:14px;">Загружаем ваше пространство...</div></div>';
    return;
  }
  if(!state.identity){
    app.innerHTML = screenOnboarding();
    return;
  }
  let html = '';
  if(state.view === 'qdetail') html = screenQuestionDetail();
  else if(state.view === 'feed') html = screenFeed();
  else if(state.view === 'answers') html = screenAnswersHistory();
  else if(state.view === 'memories') html = state.showAddMemory ? screenAddMemory() : screenMemories();
  else if(state.view === 'add') html = screenAdd();
  else if(state.tab === 'home') html = screenHome();
  else if(state.tab === 'questions') html = screenQuestions();
  else if(state.tab === 'us') html = screenUs();
  else if(state.tab === 'more') html = screenMore();

  const showNav = !state.view;
  app.innerHTML = html + (showNav ? bottomNavHtml() : '') + toastHtml();
}

/* ============ NAV ACTIONS ============ */
function goTab(tab){ state.tab = tab; state.view=null; state.openCategory=null; render(); }
function goView(v){
  state.view = v;
  render();
  if(v === 'feed'){ markFeedSeen().then(render); }
}
function goBack(){ state.view = null; state.showAddMemory=false; render(); }
function openQuestion(id){ state.activeQuestionId = id; state.view='qdetail'; render(); }
function toggleCategory(cat){ state.openCategory = state.openCategory===cat ? null : cat; render(); }
async function chooseIdentity(name){
  state.identity = name;
  await sSet('identity', name, false);
  const seen = await sGet('last_seen:'+name, false);
  state.lastSeenActivity = seen || 0;
  render();
  startPolling();
}
function switchIdentity(){
  state.identity = null;
  sSet('identity', null, false);
  render();
}
function submitAnswerFromBox(qid){
  const box = document.getElementById('answerBox');
  if(!box) return;
  submitAnswer(qid, box.value);
}
function setAddTab(t){ state.addTab = t; render(); }
function submitManualQuestion(){
  const t = document.getElementById('manualQText').value;
  const c = document.getElementById('manualQCat').value;
  addCustomQuestion(t, c);
}
function triggerGenerate(){
  state.genTheme = document.getElementById('genThemeInput').value;
  runGenerator();
}
function addGenerated(i){
  const text = state.genResults[i];
  addCustomQuestion(text, 'Сгенерированные');
  state.genResults = state.genResults.filter((_,idx)=>idx!==i);
  render();
}
function openAddMemory(){ state.showAddMemory = true; state.memDraft = {date:'',text:'',photo:null}; render(); }
function closeAddMemory(){ state.showAddMemory = false; render(); }
async function saveMemoryDraft(){
  const date = document.getElementById('memDate').value;
  const text = document.getElementById('memText').value;
  const fileInput = document.getElementById('memPhoto');
  let photo = null;
  if(fileInput && fileInput.files && fileInput.files[0]){
    photo = await readAndCompress(fileInput.files[0]);
  }
  if(!text || !text.trim()){ showToast('Добавь текст заметки'); return; }
  await addMemory({date, text: text.trim(), photo});
  state.showAddMemory = false;
  render();
}
function toggleAvatarPicker(name){ state.showAvatarPicker = state.showAvatarPicker===name ? null : name; render(); }
function setAvatarPick(emoji){ setAvatar(state.showAvatarPicker, emoji); }

/* ============ INIT ============ */
(async function init(){
  await loadAll();
  const savedIdentity = await sGet('identity', false);
  state.identity = savedIdentity || null;
  if(state.identity){
    const seen = await sGet('last_seen:'+state.identity, false);
    state.lastSeenActivity = seen || 0;
  }
  render();
  if(state.identity) startPolling();
})();
</script>
