<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>А ты? ♡</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@500;700;800&family=Caveat:wght@700&display=swap');

  :root{
    --cream:#FBF5EA;
    --cream-soft:#F2E8D8;
    --graphite:#2C2824;
    --graphite-soft:#6B655C;
    --burgundy:#7C1F3A;
    --burgundy-deep:#571328;
    --gold:#C69A3E;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Manrope',sans-serif;
    background:radial-gradient(circle at 50% 0%, #EFE3CE, #E4D5BB 70%);
    color:var(--graphite);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
  }

  .card{
    max-width:420px;
    width:100%;
    background:var(--cream);
    border-radius:28px;
    box-shadow:0 24px 60px rgba(44,40,36,0.22);
    border:1px solid rgba(44,40,36,0.12);
    padding:36px 28px 32px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }

  .ghost-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:6px;
  }
  .ghost{
    width:150px;
    height:150px;
    animation:float 3s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{ transform: translateY(0) rotate(-2deg); }
    50%{ transform: translateY(-10px) rotate(2deg); }
  }

  .boom{
    position:absolute;
    font-family:'Caveat',cursive;
    font-weight:700;
    color:var(--gold);
    opacity:0;
    animation:pop 2.4s ease-in-out infinite;
  }
  .boom.b1{ top:18px; left:16px; font-size:26px; animation-delay:.2s; color:var(--burgundy);}
  .boom.b2{ top:40px; right:18px; font-size:22px; animation-delay:1s; }
  .boom.b3{ bottom:120px; left:10px; font-size:20px; animation-delay:1.8s; color:var(--burgundy);}
  @keyframes pop{
    0%{ opacity:0; transform:scale(.6) rotate(-8deg); }
    15%{ opacity:1; transform:scale(1.15) rotate(4deg); }
    30%{ opacity:1; transform:scale(1) rotate(0); }
    55%{ opacity:0; }
    100%{ opacity:0; }
  }

  .title{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:26px;
    line-height:1.35;
    color:var(--burgundy);
    margin:6px 0 10px;
  }

  .subtitle{
    font-family:'Caveat',cursive;
    font-weight:700;
    font-size:30px;
    color:var(--graphite);
    margin:0 0 18px;
    letter-spacing:.01em;
  }

  .divider{
    width:60px;
    height:3px;
    background:var(--gold);
    border-radius:3px;
    margin:0 auto 18px;
    opacity:.6;
  }

  .desc{
    font-size:14px;
    color:var(--graphite-soft);
    line-height:1.6;
    margin:0 0 4px;
  }

  .sticker{
    display:inline-block;
    margin-top:20px;
    font-family:'Caveat',cursive;
    font-weight:700;
    font-size:17px;
    background:#FFF7E6;
    color:var(--graphite);
    padding:9px 18px 7px;
    border-radius:4px;
    box-shadow:0 6px 14px rgba(44,40,36,0.15);
    transform:rotate(-3deg);
    position:relative;
  }
  .sticker::before{
    content:"";
    position:absolute;
    top:-8px; left:50%;
    transform:translateX(-50%) rotate(-3deg);
    width:40px; height:14px;
    background:rgba(255,255,255,0.55);
    border:1px solid rgba(0,0,0,0.05);
  }
</style>
</head>
<body>
  <div class="card">
    <span class="boom b1">пу!</span>
    <span class="boom b2">пуу!</span>
    <span class="boom b3">пу-пу!</span>

    <div class="ghost-wrap">
      <svg class="ghost" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="100" cy="185" rx="50" ry="8" fill="#2C2824" opacity="0.08"/>
        <path d="M100 20
                 C55 20 30 55 30 100
                 L30 160
                 C30 168 38 172 44 166
                 L56 154
                 C60 150 66 150 70 154
                 L84 168
                 C88 172 94 172 98 168
                 L100 166
                 L102 168
                 C106 172 112 172 116 168
                 L130 154
                 C134 150 140 150 144 154
                 L156 166
                 C162 172 170 168 170 160
                 L170 100
                 C170 55 145 20 100 20 Z"
              fill="#F7EFE0" stroke="#7C1F3A" stroke-width="3"/>
        <circle cx="78" cy="92" r="7" fill="#2C2824"/>
        <circle cx="122" cy="92" r="7" fill="#2C2824"/>
        <path d="M82 118 Q100 108 118 118" stroke="#2C2824" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M60 78 Q65 65 78 64" stroke="#C69A3E" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
      </svg>
    </div>

    <div class="title">«А ты?» ♡</div>
    <div class="subtitle">а всё, надо было раньше…<br/>приложение удалено</div>
    <div class="divider"></div>
    <p class="desc">пу-пу-пуу 🕊️<br/>шанс был, шанс использован не был.</p>

    <div class="sticker">RIP наш альбом, 2026 💔</div>
  </div>
</body>
</html>
